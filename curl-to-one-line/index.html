<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cUrl 转单行工具</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 20px;
    background: #f5f7fa;
}

h2 {
    text-align: center;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 220px;
    padding: 12px;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
}

.buttons {
    margin: 15px 0;
    display: flex;
    gap: 10px;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #1677ff;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: 0.9;
}

#copyBtn {
    background: #52c41a;
}

#addFilterBtn {
    background: #888;
    font-size: 13px;
    padding: 6px 14px;
    margin-top: 4px;
}

.filter-row {
    display: flex;
    gap: 8px;
    margin: 6px 0;
    align-items: center;
}

.filter-row input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    font-family: Consolas, Monaco, monospace;
}

.filter-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}
</style>
</head>
<body>

<h2>cUrl 转单行工具</h2>

<label>输入多行 cUrl：</label>
<textarea id="input" placeholder="粘贴 curl 命令..."></textarea>

<label>过滤规则：勾选后删除包含指定内容的行</label>
<div id="filters">
    <div class="filter-row">
        <input type="checkbox" class="filter-check" checked>
        <input type="text" class="filter-input" placeholder="删除包含此内容的行...">
    </div>
    <div class="filter-row">
        <input type="checkbox" class="filter-check" checked>
        <input type="text" class="filter-input" placeholder="删除包含此内容的行...">
    </div>
    <div class="filter-row">
        <input type="checkbox" class="filter-check" checked>
        <input type="text" class="filter-input" placeholder="删除包含此内容的行...">
    </div>
</div>
<button id="addFilterBtn" onclick="addFilterRow()">+ 添加过滤行</button>

<div class="buttons">
    <button onclick="convertCurl()">转换</button>
    <button id="copyBtn" onclick="copyResult()">复制结果</button>
</div>

<label>转换结果：</label>
<textarea id="output" readonly></textarea>

<script>
const STORAGE_KEY = 'curl-to-line-filters';

function getActiveFilters() {
    const rows = document.querySelectorAll('.filter-row');
    const filters = [];
    rows.forEach(row => {
        const check = row.querySelector('.filter-check');
        const input = row.querySelector('.filter-input');
        if (check.checked && input.value.trim()) {
            filters.push(input.value.trim());
        }
    });
    return filters;
}

function saveFilterState() {
    const rows = document.querySelectorAll('.filter-row');
    const state = [];
    rows.forEach(row => {
        const check = row.querySelector('.filter-check');
        const input = row.querySelector('.filter-input');
        state.push({ checked: check.checked, value: input.value });
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function rebuildFilters() {
    const container = document.getElementById('filters');
    container.innerHTML = '';
    let state;
    try {
        state = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch {}
    if (!state || !Array.isArray(state) || state.length === 0) {
        state = [{ checked: false, value: '' }, { checked: false, value: '' }, { checked: false, value: '' }];
    }
    state.forEach(item => {
        const row = document.createElement('div');
        row.className = 'filter-row';
        row.innerHTML = `
            <input type="checkbox" class="filter-check" ${item.checked ? 'checked' : ''}>
            <input type="text" class="filter-input" placeholder="删除包含此内容的行..." value="${escapeHtml(item.value)}">
        `;
        container.appendChild(row);
    });
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function convertCurl() {
    const input = document.getElementById("input").value;
    let lines = input.split(/\r?\n/).map(line => line.trim());

    const filters = getActiveFilters();
    filters.forEach(filter => {
        lines = lines.filter(line => !line.includes(filter));
    });

    const result = lines
        .filter(line => line.length > 0)
        .map(line => {
            if (line.endsWith("\\")) {
                return line.slice(0, -1).trim();
            }
            return line;
        })
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();

    document.getElementById("output").value = result;
    saveFilterState();
}

function addFilterRow() {
    const container = document.getElementById('filters');
    const row = document.createElement('div');
    row.className = 'filter-row';
    row.innerHTML = `
        <input type="checkbox" class="filter-check" checked>
        <input type="text" class="filter-input" placeholder="删除包含此内容的行...">
    `;
    container.appendChild(row);
}

async function copyResult() {
    const text = document.getElementById("output").value;

    if (!text) {
        alert("没有可复制的内容");
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        alert("已复制到剪贴板");
    } catch {
        alert("复制失败");
    }
}
document.addEventListener('DOMContentLoaded', rebuildFilters);
</script>
</body>
</html>
