<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name='description' content="导航">
    <title>简单导航</title>
    <link rel="shortcut icon" href="./favicon.ico" />
    <style>
        /* 基础变量定义 - 明色主题 */
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --hover-bg: #f1f5f9;
            --accent-color: #3b82f6;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }

        /* 暗色主题变量 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --container-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --hover-bg: #334155;
                --accent-color: #60a5fa;
                --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px -1px rgba(0, 0, 0, 0.3);
            }
        }

        /* 消除所有动画与过渡效果，确保低性能设备绝对流畅 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: none !important;
            animation: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 响应式网格布局 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* 导航卡片样式 */
        .nav-item {
            display: block;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            box-shadow: var(--shadow);
        }

        .nav-item:hover, .nav-item:focus-visible {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
            outline: none;
        }

        .nav-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .nav-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 针对超小屏幕的微调 */
        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }
            header {
                margin-bottom: 24px;
            }
            header h1 {
                font-size: 24px;
            }
            .nav-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .nav-item {
                padding: 12px;
            }
            .nav-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>简单导航</h1>
            <p>简约不凡的网站导航</p>
        </header>

        <main id="navContainer" class="nav-grid">
            <!-- 导航按钮将通过 JavaScript 动态渲染到这里 -->
        </main>
    </div>

    <script>
        /**
         * 导航数据配置数组
         * * 说明：
         * 每个对象代表一个导航按钮，包含以下三个属性：
         * - name: 导航站点的名称
         * - url: 站点的完整链接（需包含 http:// 或 https://）
         * - desc: 站点的一句话简介（可选，若不需要留空字符串即可 ""）
         */
        const navData = [
            { name: "谷歌", url: "https://www.google.com", desc: "搜索引擎" },
            { name: "cf优选域名", url: "https://cf.090227.xyz", desc: "Cloudflare 优选域名" },
            { name: "itdog", url: "https://www.itdog.cn", desc: "在线 ping" },
            { name: "ipip", url: "https://myip.ipip.net", desc: "IP 及归属地" },
            { name: "ip.sb", url: "https://ip.sb", desc: "IP 查询" },
            { name: "dig", url: "https://www.diggui.com", desc: "在线 dig" },
            { name: "cUrlToOneLine", url: "./curl-to-one-line/index.html", desc: "cUrl 转单行" },
            { name: "pfxReader", url: "./pfx-reader/index.html", desc: "pfx/p12 证书查看" },
            { name: "拍照并压缩重命名", url: "./photo-resize-rename/index.html", desc: "拍照并压缩/重命名/下载" },
            { name: "中科大测速", url: "https://test.ustc.edu.cn", desc: "测试网络延迟/延迟抖动/下载速度/上传速度" },
            { name: "Fiber 测速", url: "https://fiber.google.com/speedtest", desc: "Google Fiber 测速" },
            { name: "iCalendar", url: "https://icalendar.org/validator.html", desc: "iCalendar 验证/工具/规范" },
            { name: "Keyboard Test", url: "https://keyboard.thesixonenine.site", desc: "键盘按键测试" },
            { name: "Login Demo", url: "https://react.thesixonenine.site", desc: "登录页案例" },
            { name: "GalGame", url: "https://ttloli.com", desc: "忧郁的弟弟(mmgal.com)" },
            { name: "合同示范", url: "https://htsfwb.samr.gov.cn", desc: "合同示范文本库" },
            { name: "Hyprland 文档", url: "https://hyprland.057293.xyz", desc: "反代 Hyprland 文档" },
            { name: "Docker 文档", url: "https://docker.057293.xyz/manuals", desc: "反代 Docker 文档" },
            { name: "Pi 文档", url: "https://pi.057293.xyz/docs/latest", desc: "反代 pi.dev 文档" },
            { name: "Arch 文档", url: "https://arch.057293.xyz/wiki/首页", desc: "反代 Arch wiki" },
            { name: "Noctalia 文档", url: "https://noctalia.057293.xyz/v5/", desc: "反代 Noctalia 文档" },
            { name: "JSON 格式化", url: "./json-format/index.html", desc: "JSON 格式化 via FE-Helper" },
            { name: "信息编码/解码", url: "./en-decode/index.html", desc: "信息编码/解码 via FE-Helper" },
            { name: "时间戳转换", url: "./timestamp/index.html", desc: "时间戳转换 via FE-Helper" },
            { name: "二维码生成/解码", url: "./qr-code/index.html", desc: "二维码生成/解码 via FE-Helper" },

            { name: "GitHub", url: "https://github.com", desc: "开源代码托管平台" }
        ];

        // 动态渲染导航卡片的方法
        function renderNav() {
            const container = document.getElementById('navContainer');
            if (!container) return;

            // 构造 HTML 字符串
            let htmlStr = '';
            for (let i = 0; i < navData.length; i++) {
                const item = navData[i];
                // 如果没有提供描述，则默认显示网址域名
                const description = item.desc || item.url.replace(/^https?:\/\/(www\.)?/, '');
                htmlStr += `
                    <a href="${item.url}" class="nav-item" target="_blank" rel="noopener noreferrer">
                        <div class="nav-title">${item.name}</div>
                        <div class="nav-desc">${description}</div>
                    </a>
                `;
            }
            // 一次性渲染，减少 DOM 操作提高性能
            container.innerHTML = htmlStr;
        }

        // 页面加载完成后立即执行渲染
        document.addEventListener('DOMContentLoaded', renderNav);
    </script>
</body>
</html>
